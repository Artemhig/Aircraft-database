<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
const theme = DarkModeToggle.darkModeEnabled ? 'dark' : 'default'
mermaid.initialize({ startOnLoad: true, theme: theme });
(function() {
  const elementCode = '.mermaid';
  const loadMermaid = function(theme) {
    mermaid.initialize({theme})
    mermaid.init({theme}, document.querySelectorAll(elementCode))
  }
  const saveOriginalData = function() {
    return new Promise((resolve, reject) => {
      try {
        var els = document.querySelectorAll(elementCode), count = els.length;
        els.forEach(element => {
          element.setAttribute('data-original-code', element.innerHTML)
          count--
          if (count == 0) { resolve() }
        });
      } catch (error) { reject(error) }
    })
  }
  const resetProcessed = function(){
    return new Promise((resolve, reject) => {
      try {
        var els = document.querySelectorAll(elementCode), count = els.length;
        els.forEach(element => {
          if (element.getAttribute('data-original-code') != null) {
              element.removeAttribute('data-processed')
              element.innerHTML = element.getAttribute('data-original-code')
          }
          count--
          if(count == 0) { resolve() }
        });
      } catch (error) { reject(error) }
    })
  }
  saveOriginalData()
  const original = DarkModeToggle.enableDarkMode.bind(DarkModeToggle);
  DarkModeToggle.enableDarkMode = function(enable) {
      original(enable);
      resetProcessed().then(loadMermaid(enable ? 'dark' : 'default')).catch(console.error)
  };
})();
</script>
